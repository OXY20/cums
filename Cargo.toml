[package]
name = "cums"
version = "2.3.3"
edition = "2021"
description = "CUMS - 课堂文件上传管理系统"

[dependencies]
actix-web = "4"
actix-multipart = "0.7"
actix-files = "0.6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
chrono = "0.4"
uuid = { version = "1", features = ["v4"] }
sanitize-filename = "0.6"
futures-util = "0.3"
log = "0.4"
env_logger = "0.11"
urlencoding = "2.1"