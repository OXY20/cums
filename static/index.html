<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<title>CUMS 课程中心</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;background:#f5f5f5;min-height:100vh;color:#333}
a{color:#1890ff;text-decoration:none}
a:hover{color:#40a9ff}
.navbar{background:#fff;padding:0 24px;height:56px;display:flex;align-items:center;justify-content:space-between;box-shadow:0 1px 4px rgba(0,0,0,.08);position:sticky;top:0;z-index:100}
.nav-left{display:flex;align-items:center;gap:24px}
.nav-brand{display:flex;align-items:center;gap:8px;font-size:17px;font-weight:600;color:#1a1a1a;cursor:pointer}
.nav-brand svg{width:26px;height:26px;display:block}
.nav-links{display:flex;gap:4px}
.nav-links a{padding:8px 16px;border-radius:6px;font-size:14px;color:#555;cursor:pointer;transition:all .15s}
.nav-links a:hover,.nav-links a.active{background:#e6f7ff;color:#1890ff}
.nav-right{display:flex;align-items:center;gap:12px}
.btn-login{padding:6px 20px;border:1px solid #1890ff;border-radius:6px;font-size:14px;color:#1890ff;background:#fff;cursor:pointer;transition:all .15s}
.btn-login:hover{background:#1890ff;color:#fff}
.user-menu{position:relative;cursor:pointer}
.user-menu .trigger{display:flex;align-items:center;gap:6px;padding:6px 12px;border-radius:6px;font-size:14px;color:#555}
.user-menu .trigger:hover{background:#f0f0f0}
.user-dropdown{display:none;position:absolute;right:0;top:100%;margin-top:6px;background:#fff;border-radius:10px;box-shadow:0 4px 20px rgba(0,0,0,.12);min-width:200px;overflow:hidden;z-index:200}
.user-dropdown.show{display:block}
.user-dropdown .dd-header{padding:12px 16px;border-bottom:1px solid #f0f0f0;font-size:14px;color:#333}
.user-dropdown .dd-header .name{font-weight:600}
.user-dropdown .dd-header .class{color:#999;font-size:12px}
.user-dropdown .dd-current{padding:10px 16px;border-bottom:1px solid #f0f0f0;font-size:13px}
.user-dropdown .dd-current .label{color:#999}
.user-dropdown .dd-item{display:flex;align-items:center;gap:8px;padding:10px 16px;font-size:14px;color:#555;cursor:pointer;transition:background .1s;border:none;background:none;width:100%;text-align:left}
.user-dropdown .dd-item:hover{background:#f5f5f5}
.main{max-width:1100px;margin:0 auto;padding:24px 16px}
.view{display:none}
.view.active{display:block}
.current-banner{background:#fff;border-radius:12px;padding:24px;margin-bottom:24px;box-shadow:0 1px 4px rgba(0,0,0,.06);display:flex;gap:24px}
.current-banner .banner-left{flex:7;min-width:0;position:relative}
.current-banner .banner-right{flex:3;min-width:0}
.current-banner .banner-label{font-size:12px;color:#999;margin-bottom:12px}
/* 轮播容器 16:9 */
.current-banner .banner-carousel{position:relative;width:100%;aspect-ratio:16/9;background:#f0f2f5;border-radius:10px;overflow:hidden}
.current-banner .banner-carousel .slide{position:absolute;top:0;left:0;width:100%;height:100%;opacity:0;transition:opacity .8s ease;cursor:pointer;background-size:cover;background-position:center;display:flex;align-items:flex-end;padding:20px;color:#fff}
.current-banner .banner-carousel .slide.active{opacity:1}
.current-banner .banner-carousel .slide .slide-overlay{background:linear-gradient(transparent,rgba(0,0,0,.6));position:absolute;bottom:0;left:0;right:0;padding:20px}
.current-banner .banner-carousel .slide .slide-title{font-size:18px;font-weight:600}
.current-banner .banner-carousel .slide .slide-meta{font-size:13px;opacity:.8;margin-top:4px}
.current-banner .banner-carousel .dots{position:absolute;bottom:12px;right:16px;display:flex;gap:6px;z-index:5}
.current-banner .banner-carousel .dots .dot{width:8px;height:8px;border-radius:50%;background:rgba(255,255,255,.4);cursor:pointer;transition:all .3s;border:none;padding:0}
.current-banner .banner-carousel .dots .dot.active{background:#fff;transform:scale(1.2)}
.current-banner .banner-card{background:#f5f7fa;border-radius:10px;padding:14px;display:flex;flex-direction:column;height:100%;min-height:240px;position:relative;justify-content:space-between}
.current-banner .banner-badge{position:absolute;top:12px;right:12px;background:#ff4d4f;color:#fff;font-size:11px;padding:2px 10px;border-radius:12px;font-weight:500;z-index:2}
.current-banner .banner-card-cover{width:100%;aspect-ratio:16/9;border-radius:6px;background:linear-gradient(135deg,#1890ff,#36cfc9);display:flex;align-items:center;justify-content:center;color:#fff;font-size:12px;margin-bottom:8px;overflow:hidden;flex-shrink:0}
.current-banner .banner-card-cover img{width:100%;height:100%;object-fit:cover}
.current-banner .banner-card-title{font-size:15px;font-weight:600;color:#1a1a1a;margin-top:2px}
.current-banner .banner-card-desc{font-size:12px;color:#888;margin-top:2px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;line-height:1.3;flex-shrink:0;min-height:0}
.current-banner .banner-card-meta{font-size:12px;color:#666;margin-top:2px}
.current-banner .banner-card-progress{font-size:12px;color:#999;margin-top:2px}
.current-banner .banner-status{display:inline-flex;align-items:center;gap:4px;font-size:12px;padding:2px 10px;border-radius:4px;margin-top:4px}
.current-banner .banner-card .btn-group{display:flex;gap:8px;margin-top:6px;width:100%}
.current-banner .banner-card .btn-group .btn{flex:1;text-align:center;padding:6px 0;font-size:13px;border-radius:6px}
.current-banner .banner-status.green{background:#f6ffed;color:#52c41a}
.current-banner .banner-status.red{background:#fff2f0;color:#ff4d4f}
.current-banner .banner-status.blue{background:#e6f7ff;color:#1890ff}
.current-banner .banner-card .btn-group{display:flex;gap:8px;margin-top:12px}
.current-banner .banner-card .btn-group .btn{flex:1;text-align:center}
.current-banner .banner-card .btn-group .btn-submit{background:#52c41a;color:#fff}
.current-banner .banner-card .btn-group .btn-submit:hover{background:#73d13d}
.btn{padding:8px 18px;border:none;border-radius:6px;font-size:14px;cursor:pointer;transition:all .15s;display:inline-flex;align-items:center;gap:6px}
.btn svg{width:14px;height:14px}
.btn-primary{background:#1890ff;color:#fff}
.btn-primary:hover{background:#40a9ff}
.btn-outline{background:#fff;border:1px solid #1890ff;color:#1890ff}
.btn-outline:hover{background:#e6f7ff}
.btn-success{background:#52c41a;color:#fff}
.btn-success:hover{background:#73d13d}
.btn-sm{padding:5px 12px;font-size:12px}
.section-title{font-size:16px;font-weight:600;color:#1a1a1a;margin-bottom:16px;padding-bottom:8px;border-bottom:1px solid #f0f0f0}
.filter-row{display:flex;gap:12px;margin-bottom:16px}
.filter-row select{padding:6px 12px;border:1px solid #d9d9d9;border-radius:6px;font-size:13px;color:#555;background:#fff}
.course-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.course-card{background:#fff;border-radius:10px;overflow:hidden;box-shadow:0 1px 4px rgba(0,0,0,.06);cursor:pointer;transition:box-shadow .15s}
.course-card:hover{box-shadow:0 4px 16px rgba(0,0,0,.1)}
.course-card .card-cover{height:120px;background:linear-gradient(135deg,#1890ff,#36cfc9);display:flex;align-items:center;justify-content:center;color:#fff;font-size:12px;overflow:hidden}
.course-card .card-cover img{width:100%;height:100%;object-fit:cover}
.course-card .card-body{padding:16px}
.course-card .card-title{font-size:16px;font-weight:600;color:#1a1a1a;margin-bottom:4px}
.course-card .card-major{font-size:12px;color:#999;margin-bottom:6px}
.course-card .card-meta{font-size:12px;color:#999}
.course-header{display:flex;gap:24px;margin-bottom:24px}
.course-header .ch-left{flex:7;background:#fff;border-radius:12px;padding:24px;box-shadow:0 1px 4px rgba(0,0,0,.06)}
.course-header .ch-right{flex:3;background:#fff;border-radius:12px;padding:24px;box-shadow:0 1px 4px rgba(0,0,0,.06)}
.ch-right .cover-img{width:100%;min-height:120px;border-radius:8px;background:linear-gradient(135deg,#1890ff,#36cfc9);display:flex;align-items:center;justify-content:center;color:#fff;font-size:14px;margin-bottom:12px;overflow:hidden}
.ch-right .cover-img img{width:100%;height:100%;object-fit:cover}
.ch-right .course-name{font-size:18px;font-weight:600;margin-bottom:4px}
.ch-right .course-major{font-size:12px;color:#999;margin-bottom:8px}
.ch-right .course-desc{font-size:13px;color:#666;line-height:1.6}
.progress-bar{height:8px;background:#f0f0f0;border-radius:4px;margin:12px 0;overflow:hidden}
.progress-bar .fill{height:100%;background:#1890ff;border-radius:4px;transition:width .3s}
.progress-info{display:flex;align-items:center;gap:10px;font-size:13px;color:#666;margin-bottom:10px}
.progress-actions{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.lesson-list{background:#fff;border-radius:12px;box-shadow:0 1px 4px rgba(0,0,0,.06);overflow:hidden}
.lesson-item{display:flex;align-items:center;padding:16px 24px;border-bottom:1px solid #f5f5f5;cursor:pointer;transition:background .1s}
.lesson-item:hover{background:#fafafa}
.lesson-item:last-child{border-bottom:none}
.lesson-item .li-icon{flex-shrink:0;width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;margin-right:12px}
.lesson-item .li-icon svg{width:16px;height:16px}
.lesson-item .li-icon.green{background:#f6ffed;color:#52c41a}
.lesson-item .li-icon.red{background:#fff2f0;color:#ff4d4f}
.lesson-item .li-icon.blue{background:#e6f7ff;color:#1890ff}
.lesson-item .li-icon.gray{background:#f5f5f5;color:#bbb}
.lesson-item .li-info{flex:1;min-width:0}
.lesson-item .li-name{font-size:15px;font-weight:500;color:#1a1a1a}
.lesson-item .li-desc{font-size:12px;color:#999;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lesson-item .li-tag{flex-shrink:0;font-size:12px;padding:3px 10px;border-radius:4px;margin:0 12px}
.lesson-item .li-tag.green{background:#f6ffed;color:#52c41a}
.lesson-item .li-tag.red{background:#fff2f0;color:#ff4d4f}
.lesson-item .li-tag.blue{background:#e6f7ff;color:#1890ff}
.lesson-item .li-arrow{color:#bbb;flex-shrink:0}
.lesson-detail{display:flex;gap:24px;align-items:flex-start}
.lesson-detail .ld-main{flex:7;background:#fff;border-radius:12px;padding:32px;box-shadow:0 1px 4px rgba(0,0,0,.06);min-width:0}
.lesson-detail .ld-side{flex:3;position:sticky;top:72px;background:#fff;border-radius:12px;padding:20px;box-shadow:0 1px 4px rgba(0,0,0,.06)}
.ld-main .ld-title{font-size:20px;font-weight:600;margin-bottom:12px}
.ld-main .ld-intro{padding:12px 16px;background:#f0f7ff;border-left:3px solid #1890ff;border-radius:6px;color:#555;font-size:13px;line-height:1.7;margin-bottom:20px}
.ld-main .ld-content{line-height:1.8;color:#333;overflow-wrap:anywhere}
.ld-main .ld-content h1,.ld-main .ld-content h2,.ld-main .ld-content h3{margin:16px 0 8px}
.ld-main .ld-content img{max-width:100%;height:auto;border-radius:6px}
.ld-main .ld-content video{max-width:100%;border-radius:6px}
.ld-main .ld-content pre{background:#f5f5f5;padding:12px;border-radius:6px;overflow-x:auto}
.ld-main .ld-content code{background:#f5f5f5;padding:2px 6px;border-radius:3px;font-size:13px}
.toc-title{font-size:14px;font-weight:600;margin-bottom:12px;display:flex;align-items:center;gap:6px}
.toc-list{list-style:none;max-height:360px;overflow:hidden}
.toc-list.expanded{max-height:none}
.toc-list li{padding:8px 10px;border-radius:6px;font-size:13px;color:#555;cursor:pointer;transition:background .1s;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.toc-list li:hover{background:#f5f5f5}
.toc-list li.current{color:#ff4d4f;font-weight:600;background:#fff2f0}
.toc-toggle{display:flex;align-items:center;justify-content:center;gap:4px;padding:8px;font-size:12px;color:#1890ff;cursor:pointer;margin-top:4px}
.toc-toggle:hover{color:#40a9ff}
.side-btn{display:flex;align-items:center;justify-content:center;gap:6px;width:100%;padding:10px;border-radius:6px;font-size:14px;cursor:pointer;margin-top:12px;transition:all .15s;border:none}
.side-btn-download{background:#f5f5f5;color:#555}
.side-btn-download:hover{background:#e8e8e8}
.side-btn-download svg{width:14px;height:14px}
.side-btn-submit{background:#52c41a;color:#fff}
.side-btn-submit:hover{background:#73d13d}
.side-btn-submit svg{width:14px;height:14px}
.modal-overlay{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.35);z-index:300;align-items:center;justify-content:center}
.modal-overlay.show{display:flex}
.modal{background:#fff;border-radius:12px;padding:32px;width:380px;max-width:90vw;box-shadow:0 8px 32px rgba(0,0,0,.15);position:relative}
.modal-title{font-size:18px;font-weight:600;margin-bottom:20px;display:flex;align-items:center;gap:8px}
.modal-title svg{width:20px;height:20px}
.form-group{margin-bottom:16px}
.form-group label{display:block;margin-bottom:6px;font-size:14px;color:#555}
.form-group input,.form-group select{width:100%;padding:10px 12px;border:1px solid #d9d9d9;border-radius:6px;font-size:14px;transition:border-color .15s}
.form-group input:focus,.form-group select:focus{outline:none;border-color:#1890ff;box-shadow:0 0 0 2px rgba(24,144,255,.15)}
.modal-hint{margin-top:16px;font-size:12px;color:#999;display:flex;align-items:center;gap:4px}
.modal-close{position:absolute;top:16px;right:16px;width:28px;height:28px;border:none;background:none;cursor:pointer;font-size:18px;color:#999;display:flex;align-items:center;justify-content:center;border-radius:50%}
.modal-close:hover{background:#f5f5f5}
.attach-modal{width:480px;max-width:95vw}
.attach-list{max-height:400px;overflow-y:auto}
.attach-item{display:flex;align-items:center;padding:12px 0;border-bottom:1px solid #f5f5f5}
.attach-item:last-child{border-bottom:none}
.attach-item .ai-name{flex:1;font-size:14px;color:#333;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.attach-item .ai-size{font-size:12px;color:#999;margin:0 12px;flex-shrink:0}
.attach-item .ai-actions{display:flex;gap:6px;flex-shrink:0}
.attach-item .ai-actions .btn svg{width:14px;height:14px}
.attach-download-all{margin-top:16px;text-align:center}
.attach-download-all .btn svg{width:14px;height:14px}
.my-course-card{background:#fff;border-radius:12px;padding:24px;box-shadow:0 1px 4px rgba(0,0,0,.06);margin-bottom:16px}
.my-course-card .mcc-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.my-course-card .mcc-name{font-size:18px;font-weight:600}
.status-group{margin-top:12px}
.status-group .sg-title{display:flex;align-items:center;gap:6px;font-size:14px;font-weight:500;margin-bottom:8px;cursor:pointer}
.status-group .sg-title.green{color:#52c41a}
.status-group .sg-title.red{color:#ff4d4f}
.status-group .sg-title.blue{color:#1890ff}
.status-group .sg-body{padding-left:20px;font-size:13px;color:#666}
.status-group .sg-body .sg-item{padding:6px 0;display:flex;align-items:center;justify-content:space-between}
.footer{text-align:center;padding:20px;color:#bbb;font-size:12px}
@media(max-width:768px){
  .course-grid{grid-template-columns:repeat(2,1fr)}
  .course-header{flex-direction:column}
  .lesson-detail{flex-direction:column}
  .lesson-detail .ld-side{position:static;width:100%}
  .navbar{padding:0 12px}
  .current-banner{flex-wrap:wrap}
  .ld-side-fab{display:flex}
}
@media(max-width:480px){.course-grid{grid-template-columns:1fr}}
.ld-side-fab{display:none;position:fixed;right:16px;bottom:80px;width:44px;height:44px;border-radius:50%;background:#1890ff;color:#fff;box-shadow:0 4px 12px rgba(0,0,0,.2);z-index:150;align-items:center;justify-content:center;cursor:pointer;border:none}
.ld-side-fab:hover{background:#40a9ff}
.ld-side-panel{display:none;position:fixed;top:0;right:0;width:300px;max-width:80vw;height:100%;background:#fff;z-index:250;box-shadow:-4px 0 20px rgba(0,0,0,.15);overflow-y:auto;padding:20px}
.ld-side-panel.show{display:block}
.ld-side-panel .panel-close{float:right;width:28px;height:28px;border:none;background:none;font-size:18px;cursor:pointer;color:#999;border-radius:50%}
.ld-side-panel .panel-close:hover{background:#f5f5f5}
.course-pagination{display:flex;justify-content:center;gap:8px;margin-top:20px;align-items:center;flex-wrap:wrap}
.course-pagination .page-btn{padding:6px 14px;border:1px solid #d9d9d9;border-radius:8px;background:#fff;color:#555;font-size:13px;cursor:pointer;transition:all .2s;min-width:36px;text-align:center}
.course-pagination .page-btn:hover:not(:disabled){border-color:#1890ff;color:#1890ff}
.course-pagination .page-btn.active{background:#1890ff;border-color:#1890ff;color:#fff}
.course-pagination .page-btn:disabled{opacity:.4;cursor:not-allowed}
.course-pagination .page-info{font-size:13px;color:#999;margin-left:8px}
</style>
</head>

<script>
var currentUser = null;
var configData = null;
var currentView = 'home';
var currentSubject = null;
var currentHomework = null;
var currentLesson = null;
var currentAttachments = [];
var tocExpanded = false;

async function init() {
  await loadConfig();
  await loadVersion();
  loadSavedUser();
  showView('home');
}
init();


// ========== 课程分页功能 ==========
var coursePageSize = 9;
var courseCurrentPage = 1;
var filteredCourses = [];

function renderCourses() {
  if (!configData) return;
  var majorFilter = document.getElementById('filterMajor').value;
  var classFilter = document.getElementById('filterClass').value;
  var allCourses = [];
  for (var subject in configData.subjects) {
    var subj = configData.subjects[subject];
    if (majorFilter !== '全部专业' && subj.major !== majorFilter) continue;
    if (classFilter !== '全部班级' && (!subj.classes || subj.classes.indexOf(classFilter) === -1)) continue;
    var totalLessons = 0;
    subj.homeworks.forEach(function(h){ totalLessons += (h.lessons ? h.lessons.length : 0); });
    allCourses.push({ subject: subject, major: subj.major || '', totalLessons: totalLessons, cover: subj.cover_image || '' });
  }
  filteredCourses = allCourses;
  courseCurrentPage = 1;
  renderCoursePage();
}

function renderCoursePage() {
  var grid = document.getElementById('courseGrid');
  if (!grid) return;
  var total = filteredCourses.length;
  var totalPages = Math.ceil(total / coursePageSize) || 1;
  if (courseCurrentPage > totalPages) courseCurrentPage = totalPages;
  if (courseCurrentPage < 1) courseCurrentPage = 1;
  var start = (courseCurrentPage - 1) * coursePageSize;
  var end = Math.min(start + coursePageSize, total);
  var pageCourses = filteredCourses.slice(start, end);
  var html = '';
  if (pageCourses.length === 0) {
    html = '<div style="grid-column:1/-1;text-align:center;color:#999;padding:40px">暂无课程</div>';
  } else {
    for (var i = 0; i < pageCourses.length; i++) {
      var c = pageCourses[i];
      html += '<div class="course-card" onclick="openCourse(&apos;' + esc(c.subject) + '&apos;)">';
      html += '<div class="card-cover">';
      if (c.cover) html += '<img src="' + c.cover + '" alt="">';
      else html += '<span>' + c.subject + '</span>';
      html += '</div><div class="card-body">';
      html += '<div class="card-title">' + c.subject + '</div>';
      if (c.major) html += '<div class="card-major">' + c.major + '</div>';
      html += '<div class="card-meta">共 ' + c.totalLessons + ' 课时</div>';
      html += '</div></div>';
    }
  }
  grid.innerHTML = html;
  // 渲染分页
  var container = document.getElementById('coursePagination');
  if (!container) {
    var viewHome = document.getElementById('view-home');
    if (!viewHome) return;
    var pDiv = document.createElement('div');
    pDiv.id = 'coursePagination';
    viewHome.appendChild(pDiv);
    container = pDiv;
  }
  if (totalPages <= 1) {
    container.innerHTML = '';
    return;
  }
  var pHtml = '<div class="course-pagination">';
  pHtml += '<button class="page-btn" onclick="goCoursePage(' + (courseCurrentPage - 1) + ')" ' + (courseCurrentPage <= 1 ? 'disabled' : '') + '>上一页</button>';
  for (var j = 1; j <= totalPages; j++) {
    var active = j === courseCurrentPage ? ' active' : '';
    pHtml += '<button class="page-btn' + active + '" onclick="goCoursePage(' + j + ')">' + j + '</button>';
  }
  pHtml += '<button class="page-btn" onclick="goCoursePage(' + (courseCurrentPage + 1) + ')" ' + (courseCurrentPage >= totalPages ? 'disabled' : '') + '>下一页</button>';
  pHtml += '<span class="page-info">共 ' + filteredCourses.length + ' 门课程</span>';
  pHtml += '</div>';
  container.innerHTML = pHtml;
}

function goCoursePage(page) {
  var total = filteredCourses.length;
  var totalPages = Math.ceil(total / coursePageSize) || 1;
  if (page < 1 || page > totalPages) return;
  courseCurrentPage = page;
  renderCoursePage();
  var grid = document.getElementById('courseGrid');
  if (grid) grid.scrollIntoView({ behavior: 'smooth', block: 'start' });
}

function loadConfig() {
  try {
    fetch('/api/v1/config')
      .then(function(res) { return res.json(); })
      .then(function(data) {
        if (data.success) {
          configData = data.data;
          updateFilters();
          renderCourses();
        }
      });
  } catch(e) { console.error('加载配置失败:', e); }
}

function showView(view) {
  currentView = view;
  document.querySelectorAll('.view').forEach(function(v){v.classList.remove('active')});
  var el = document.getElementById('view-' + view);
  if (el) el.classList.add('active');
  document.querySelectorAll('.nav-links a').forEach(function(a){a.classList.remove('active')});
  var navLink = document.querySelector('[data-view="' + view + '"]');
  if (navLink) navLink.classList.add('active');
  // 只在首页显示横幅，其他视图隐藏
  var banner = document.getElementById('currentBanner');
  if (view === 'home') {
    banner.style.display = '';
    updateBanner();
  } else {
    banner.style.display = 'none';
  }
  if (view === 'home') { renderCourses(); }
  if (view === 'mycourses') { renderMyCourses(); }
  if (view === 'submit') { initSubmitPage(); }
}

var bannerSlideIndex = 0;
var bannerSlideTimer = null;

function updateBanner() {
  var banner = document.getElementById('currentBanner');
  if (!configData || !configData.current_course) {
    banner.style.display = 'none';
    return;
  }
  var cc = configData.current_course;
  banner.style.display = 'flex';
  
  // 右侧卡片：当前课程信息
  var currentSubj = configData.subjects[cc.subject];
  // 添加进行中标识（通过JS动态创建，确保存在）
  var card = document.querySelector('.banner-card');
  if (card && !card.querySelector('.banner-badge')) {
    var badge = document.createElement('div');
    badge.className = 'banner-badge';
    badge.textContent = '进行中';
    card.appendChild(badge);
  }
  document.getElementById('bannerCardTitle').textContent = cc.subject;
  document.getElementById('bannerCardMeta').textContent = '班级：' + cc.class;
  // 显示课程简介
  var descEl = document.getElementById('bannerCardDesc');
  if (currentSubj && currentSubj.description) {
    descEl.textContent = currentSubj.description;
    descEl.style.display = '';
  } else {
    descEl.style.display = 'none';
  }
  // 显示进度信息
  var progressEl = document.getElementById('bannerCardProgress');
  if (currentUser && currentSubj) {
    var total = 0, completed = 0;
    if (currentSubj.homeworks) {
      currentSubj.homeworks.forEach(function(h){ total += (h.lessons ? h.lessons.length : 0); });
    }
    if (progressData) {
      for (var i = 0; i < progressData.length; i++) {
        if (progressData[i].subject === cc.subject) {
          completed = progressData[i].completed_lessons;
          break;
        }
      }
    }
    progressEl.textContent = '进度：' + completed + '/' + total + ' 课时';
    progressEl.style.display = '';
  } else {
    progressEl.style.display = 'none';
  }
  
  var coverEl = document.getElementById('bannerCardCover');
  if (currentSubj && currentSubj.cover_image) {
    coverEl.innerHTML = '<img src="' + currentSubj.cover_image + '" alt="">';
  } else {
    coverEl.innerHTML = '<span>' + cc.subject + '</span>';
  }
  
  // 左侧轮播：收集所有课程（包含当前课程，用于展示）
  var allCourses = [];
  for (var subject in configData.subjects) {
    var subj = configData.subjects[subject];
    var totalLessons = 0;
    subj.homeworks.forEach(function(h){ totalLessons += (h.lessons ? h.lessons.length : 0); });
    allCourses.push({ 
      subject: subject, 
      totalLessons: totalLessons, 
      major: subj.major || '',
      cover: subj.cover_image || '',

function goToSlide(index) {
  var slides = document.querySelectorAll('.slide');
  var dots = document.querySelectorAll('.dot');
  if (!slides.length) return;
  if (index < 0) index = slides.length - 1;
  if (index >= slides.length) index = 0;
  slides.forEach(function(s, i) {
    s.classList.toggle('active', i === index);
  });
  dots.forEach(function(d, i) {
    d.classList.toggle('active', i === index);
  });
  bannerSlideIndex = index;
}

      reader.onload = function(e) { preview.innerHTML = '<img src="' + e.target.result + '" style="max-width:100%;max-height:400px">'; };
      reader.readAsDataURL(file);
    } else if (file.type === 'application/pdf') {
      reader.onload = function(e) { preview.innerHTML = '<iframe src="' + e.target.result + '" style="width:100%;height:500px;border:none"></iframe>'; };
      reader.readAsDataURL(file);
    } else if (file.type.startsWith('video/')) {
      reader.onload = function(e) { preview.innerHTML = '<video controls style="max-width:100%;max-height:400px"><source src="' + e.target.result + '"></video>'; };
      reader.readAsDataURL(file);
    } else {
      preview.innerHTML = '<div style="text-align:center;color:#999"><div style="font-size:48px;margin-bottom:8px">[FILE]</div><div>' + file.name + '</div><div style="margin-top:8px">' + formatSize(file.size) + '</div></div>';

function formatSize(bytes) {
  if (bytes === 0 || bytes == null) return '0 B';
  var units = ['B','KB','MB','GB'];
  var i = Math.floor(Math.log(bytes) / Math.log(1024));
  return (bytes / Math.pow(1024, i)).toFixed(i > 0 ? 1 : 0) + ' ' + units[i];
}

function esc(str) {
  if (str == null) return '';
  return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}

function renderLessonList() {
  var listEl = document.getElementById('courseLessonList');
  if (!listEl) return;
  var subj = configData.subjects[currentSubject];
  if (!subj) { listEl.innerHTML = ''; return; }
  var html = '';
  var idx = 0;
  var progMap = {};
  if (progressData) {
    for (var p = 0; p < progressData.length; p++) {
      if (progressData[p].subject === currentSubject) {
        var statuses = progressData[p].lesson_statuses || [];
        statuses.forEach(function(ls){
          progMap[ls.homework_name + '||' + ls.lesson_name] = ls.status;
        });
      }
    }
  }
  for (var h = 0; h < subj.homeworks.length; h++) {
    var hw = subj.homeworks[h];
    if (!hw.lessons) continue;
    for (var l = 0; l < hw.lessons.length; l++) {
      var lesson = hw.lessons[l];
      var status = progMap[hw.name + '||' + lesson.name] || 'none';
      var iconClass = 'gray', iconSvg = 'icon-play', tagHtml = '';
      if (status === 'completed') { iconClass = 'green'; iconSvg = 'icon-check'; tagHtml = '<span class="li-tag green">已通过</span>'; }
      else if (status === 'rejected') { iconClass = 'red'; iconSvg = 'icon-alert'; tagHtml = '<span class="li-tag red">需修改</span>'; }
      else if (status === 'pending') { iconClass = 'blue'; iconSvg = 'icon-dot'; tagHtml = '<span class="li-tag blue">待评审</span>'; }
      html += '<div class="lesson-item" onclick="openLesson(' + idx + ')">' +
        '<div class="li-icon ' + iconClass + '"><svg><use href="#' + iconSvg + '"/></svg></div>' +
        '<div class="li-info"><div class="li-name">' + esc(lesson.name) + '</div>' +
        (lesson.description ? '<div class="li-desc">' + esc(lesson.description) + '</div>' : '') + '</div>' +
        tagHtml +
        '<div class="li-arrow"><svg style="width:16px;height:16px"><use href="#icon-chevron-right"/></svg></div>' +
        '</div>';
      idx++;
    }
  }
  if (idx === 0) html = '<div style="text-align:center;color:#999;padding:40px">暂无课时</div>';
  listEl.innerHTML = html;
}

// ========== Markdown 渲染（简化版，支持标题/段落/列表/图片/代码/表格/链接） ==========
function renderMarkdown(md) {
  if (!md) return '';
  // 先转义，再处理
  var html = esc(md);
  // 代码块
  html = html.replace(/\`\`\`([\s\S]*?)\`\`\`/g, function(m, code){
    return '<pre><code>' + code + '</code></pre>';
  });
  html = html.replace(/\`([^\`\n]+)\`/g, '<code>$1</code>');
  // 标题
  html = html.replace(/^### (.+)$/gm, '<h3>$1</h3>');
  html = html.replace(/^## (.+)$/gm, '<h2>$1</h2>');
  html = html.replace(/^# (.+)$/gm, '<h1>$1</h1>');
  // 粗体/斜体
  html = html.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
  html = html.replace(/\*(.+?)\*/g, '<em>$1</em>');
  // 链接（安全协议）
  html = html.replace(/\[([^\]]+)\]\(([^\s)]+)\)/g, function(m, text, url){
    if (!safeMarkdownUrl(url)) return m;
    return '<a href="' + url + '" target="_blank" rel="noopener">' + text + '</a>';
  });
  // 图片
  html = html.replace(/!\[([^\]]*)\]\(([^\s)]+)\)/g, function(m, alt, url){
    if (!safeMarkdownUrl(url)) return m;
    return '<img src="' + url + '" alt="' + alt + '" loading="lazy">';
  });
  // 无序列表
  html = html.replace(/^[-*] (.+)$/gm, '<li>$1</li>');
  html = html.replace(/(<li>[\s\S]*?<\/li>\n?)+/g, function(m){ return '<ul>' + m.trim() + '</ul>'; });
  // 有序列表（简化）
  html = html.replace(/^\d+\. (.+)$/gm, '<li>$1</li>');
  // 段落（未包裹的文本）
  html = html.replace(/\n{2,}/g, '</p><p>');
  html = html.replace(/^([^<].*)$/gm, '<p>$1</p>');
  // 表格（简化处理）
  return html;
}

function safeMarkdownUrl(url) {
  if (!url) return false;
  var lower = url.trim().toLowerCase();
  return /^(https?:|\/|#|\.)/.test(lower) && !/^javascript:/i.test(lower);
}

    var data = await res.json();
    if (!data.success) {
      alert(data.message || '登录失败');
      return;
    }
    currentUser = {
      token: data.data.token,
      student_id: data.data.student_id,
      student_name: data.data.student_name,
      class: data.data.class,
      force_password_change: data.data.force_password_change
    };
    // 记住登录
    try { localStorage.setItem('cums_user', JSON.stringify(currentUser)); } catch(e) {}
    hideLogin();
    updateUI();
    await loadProgress();
    updateBanner();
    if (currentUser.force_password_change) {
      alert('首次登录，请修改初始密码');
      showChangePassword();
    }
  } catch(e) {
    alert('网络错误，请重试');
  }
}

// ========== 用户菜单 ==========
function toggleUserMenu() {
  var dd = document.getElementById('userDropdown');
  dd.classList.toggle('show');
}
function updateUI() {
  var btnLogin = document.getElementById('btnLogin');
  var userMenu = document.getElementById('userMenu');

  if (currentUser) {
    btnLogin.style.display = 'none';
    userMenu.style.display = '';

    document.getElementById('ddName').textContent = currentUser.student_name;
    document.getElementById('ddClass').textContent = currentUser.student_id + ' · ' + currentUser.class;
    if (myCoursesNav) myCoursesNav.style.display = '';

    if (submitBtn) submitBtn.style.display = '';
  } else {

    userMenu.style.display = 'none';
    if (myCoursesNav) myCoursesNav.style.display = 'none';

}

// ========== 密码修改 ==========
function showChangePassword() {
  document.getElementById('pwdOverlay').classList.add('show');
  document.getElementById('pwdOld').value = '';
  document.getElementById('pwdNew').value = '';
  document.getElementById('pwdConfirm').value = '';
}
function hideChangePassword() {
  document.getElementById('pwdOverlay').classList.remove('show');
}
async function doChangePassword() {
  if (!currentUser) return;
  var oldPwd = document.getElementById('pwdOld').value;
  var newPwd = document.getElementById('pwdNew').value;
  var confirmPwd = document.getElementById('pwdConfirm').value;
  if (!oldPwd || !newPwd) { alert('请填写完整'); return; }
  if (newPwd.length < 6) { alert('新密码至少6位'); return; }
  if (newPwd !== confirmPwd) { alert('两次密码不一致'); return; }
  try {
    var res = await fetch('/api/v1/student/password', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'X-Student-Token': currentUser.token },
      body: JSON.stringify({ old_password: oldPwd, new_password: newPwd })
    });
    var data = await res.json();
    if (!data.success) { alert(data.message || '修改失败'); return; }
    currentUser.force_password_change = false;
    try { localStorage.setItem('cums_user', JSON.stringify(currentUser)); } catch(e) {}
    hideChangePassword();
    alert('密码修改成功');
  } catch(e) {
    alert('网络错误，请重试');
  }
}

// ========== 退出登录 ==========
function logout() {
  currentUser = null;
  try { localStorage.removeItem('cums_user'); } catch(e) {}
  updateUI();
  updateBanner();
  showView('home');
  alert('已退出登录');
}

// ========== 记住登录 ==========
function loadSavedUser() {

// ========== 进度 ==========
var progressData = null;
async function loadProgress() {
  progressData = null;
  if (!currentUser) return;
  try {
    var res = await fetch('/api/v1/student/progress', { headers: { 'X-Student-Token': currentUser.token } });
    var data = await res.json();
    if (data.success) {
      progressData = data.data;
      updateProgressUI();
      updateBanner();
    }
  } catch(e) {}
}

function updateProgressUI() {
  if (!currentSubject || !progressData) return;
  var prog = null;
  for (var i = 0; i < progressData.length; i++) {
    if (progressData[i].subject === currentSubject) { prog = progressData[i]; break; }
  }
  var total = prog ? prog.total_lessons : 0;
  var completed = prog ? prog.completed_lessons : 0;
  var issues = prog ? prog.has_issues : 0;
  var pending = total - completed - issues;
  var pct = total > 0 ? Math.round(completed / total * 100) : 0;
  document.getElementById('cpBar').style.width = pct + '%';
  document.getElementById('cpInfo').textContent = '已完成 ' + completed + '/' + total + ' 课时';
  var actionsHtml = '';
  if (total > 0) {
    actionsHtml = '<span style="color:#52c41a">通过 ' + completed + '</span>' +
      '<span style="color:#1890ff">待评审 ' + pending + '</span>' +
      '<span style="color:#ff4d4f">需修改 ' + issues + '</span>';
  }
  document.getElementById('cpActions').innerHTML = actionsHtml;
  renderLessonList();
}

// ========== 提交状态 ==========
function getSubmissionStatus(subject, homework) {
  if (!progressData) return { color: 'blue', text: '待提交' };
  for (var i = 0; i < progressData.length; i++) {
    if (progressData[i].subject === subject) {
      var statuses = progressData[i].lesson_statuses || [];
      var any = false, allPassed = true, hasPending = false, hasRejected = false;
      for (var j = 0; j < statuses.length; j++) {
        if (statuses[j].homework_name === homework) {
          any = true;
          if (statuses[j].status === 'completed') { /* 通过 */ }
          else if (statuses[j].status === 'pending') { hasPending = true; allPassed = false; }
          else if (statuses[j].status === 'rejected') { hasRejected = true; allPassed = false; }
        }
      }
      if (!any) return { color: 'blue', text: '待提交' };
      if (hasRejected) return { color: 'red', text: '需修改' };
      if (hasPending) return { color: 'blue', text: '待评审' };
      return { color: 'green', text: '已完成' };
    }
  }
  return { color: 'blue', text: '待提交' };
}

// ========== 我的课程 ==========
function renderMyCourses() {
  var container = document.getElementById('myCoursesList');
  if (!container) return;
  if (!currentUser) {
    container.innerHTML = '<div style="background:#fff;border-radius:12px;padding:40px;text-align:center;color:#999">请先登录后查看我的课程进度</div>';
    return;
  }
  var html = '';
  for (var subject in configData.subjects) {
    var subj = configData.subjects[subject];
    if (!subj.classes || subj.classes.indexOf(currentUser.class) === -1) continue;
    var prog = null;
    if (progressData) {
      for (var i = 0; i < progressData.length; i++) {
        if (progressData[i].subject === subject) { prog = progressData[i]; break; }
      }
    }
    var total = prog ? prog.total_lessons : 0;
    var completed = prog ? prog.completed_lessons : 0;
    var issues = prog ? prog.has_issues : 0;
    var pending = total - completed - issues;
    html += '<div class="my-course-card">' +
      '<div class="mcc-header"><div class="mcc-name">' + esc(subject) + '</div>' +
      '<button class="btn btn-primary btn-sm" onclick="openCourse(\'' + esc(subject) + '\')">进入课程</button></div>' +
      '<div style="font-size:12px;color:#999">' + (subj.major || '') + ' · 共' + total + '课时</div>' +
      '<div class="progress-bar"><div class="fill" style="width:' + (total > 0 ? Math.round(completed/total*100) : 0) + '%"></div></div>' +
      '<div style="font-size:13px;color:#666;margin-top:8px">已完成 ' + completed + '/' + total + ' 课时</div>' +
      '<div style="font-size:12px;color:#999;margin-top:4px">通过 ' + completed + ' · 待评审 ' + pending + ' · 需修改 ' + issues + '</div>' +
      '</div>';
  }
  if (html === '') html = '<div style="background:#fff;border-radius:12px;padding:40px;text-align:center;color:#999">当前班级暂无课程</div>';
  container.innerHTML = html;
}

// ========== 附件 ==========
var currentAttachments = [];
async function loadAttachments() {
  currentAttachments = [];
  if (!currentSubject || !currentHomework || !currentLesson) return;
  try {
    var url = '/api/v1/lesson/media/list?subject=' + encodeURIComponent(currentSubject) + '&homework=' + encodeURIComponent(currentHomework) + '&lesson=' + encodeURIComponent(currentLesson);
    var res = await fetch(url);
    var data = await res.json();
    if (data.success && data.data.files) {
      currentAttachments = data.data.files;
    }
  } catch(e) {}
}

function showAttachments() {
  var listEl = document.getElementById('attachList');
  var downloadAll = document.getElementById('attachDownloadAll');
  if (currentAttachments.length === 0) {
    listEl.innerHTML = '<div style="color:#999;text-align:center;padding:20px">本课时暂无附件</div>';
    downloadAll.style.display = 'none';
  } else {
    var html = '';
    for (var i = 0; i < currentAttachments.length; i++) {
      var a = currentAttachments[i];
      html += '<div class="attach-item">' +
        '<span class="ai-name">' + esc(a.name) + '</span>' +
        '<span class="ai-size">' + formatSize(a.size) + '</span>' +
        '<span class="ai-actions"><a class="btn btn-outline btn-sm" href="' + esc(a.url) + '" target="_blank" rel="noopener">下载</a></span>' +
        '</div>';
    }
    listEl.innerHTML = html;
    downloadAll.style.display = '';
  }
  document.getElementById('attachOverlay').classList.add('show');
}
function hideAttachments() {
  document.getElementById('attachOverlay').classList.remove('show');
}
function downloadAllAttachments() {
  if (currentAttachments.length === 0) return;
  // 逐个打开下载链接
  for (var i = 0; i < currentAttachments.length; i++) {
    window.open(currentAttachments[i].url, '_blank');
  }
}

// ========== 已上传文件抽屉 ==========
function toggleSubDrawer() {
  var drawer = document.getElementById('subDrawer');
  if (drawer) drawer.style.display = (drawer.style.display === 'none') ? '' : 'none';
}

// ========== 文件预览 ==========
function previewFile(input) {
  var file = input.files && input.files[0];
  if (!file) return;
  window._pendingFile = file;
  document.getElementById('subFileInfo').textContent = file.name + ' (' + formatSize(file.size) + ')';
  var preview = document.getElementById('subPreview');
  if (file.type.startsWith('image/')) {
    var reader = new FileReader();
    reader.onload = function(e) { preview.innerHTML = '<img src="' + e.target.result + '" style="max-width:100%;max-height:400px">'; };
    reader.readAsDataURL(file);
  } else if (file.type === 'application/pdf') {
    var reader2 = new FileReader();
    reader2.onload = function(e) { preview.innerHTML = '<iframe src="' + e.target.result + '" style="width:100%;height:500px;border:none"></iframe>'; };
    reader2.readAsDataURL(file);
  } else if (file.type.startsWith('video/')) {
    var reader3 = new FileReader();
    reader3.onload = function(e) { preview.innerHTML = '<video controls style="max-width:100%;max-height:400px"><source src="' + e.target.result + '"></video>'; };
    reader3.readAsDataURL(file);
  } else {
    preview.innerHTML = '<div style="text-align:center;color:#999"><div style="font-size:48px;margin-bottom:8px">[FILE]</div><div>' + esc(file.name) + '</div><div style="margin-top:8px">' + formatSize(file.size) + '</div></div>';
  }
}

// ========== 提交作业 ==========
async function doSubmit() {
  if (!currentUser) { showLogin(); return; }
  var subject = document.getElementById('subSubject').value;
  var homework = document.getElementById('subHomework').value;
  var fileInput = document.getElementById('subFileInput');
  if (!subject || !homework) { alert('请选择课程和作业'); return; }
  if (!fileInput.files || fileInput.files.length === 0) { alert('请选择要上传的文件'); return; }
  if (currentUser.force_password_change) { alert('请先修改初始密码后再提交作业'); showChangePassword(); return; }
  var file = fileInput.files[0];
  var formData = new FormData();
  formData.append('subject', subject);
  formData.append('homework', homework);
  formData.append('file', file);
  var btn = document.querySelector('#view-submit .btn-success');
  if (btn) { btn.disabled = true; btn.textContent = '上传中...'; }
  try {
    var res = await fetch('/api/v1/upload', {
      method: 'POST',
      headers: { 'X-Student-Token': currentUser.token },
      body: formData
    });
    var data = await res.json();
    if (!data.success) {
      alert(data.message || '上传失败');
      return;
    }
    alert('提交成功！等待教师评审');
    window._pendingFile = null;
    document.getElementById('subFileInput').value = '';
    document.getElementById('subFileInfo').textContent = '未选择文件';
    document.getElementById('subPreview').innerHTML = '请选择文件后在此处预览';
    await loadProgress();
    loadSubReview();
  } catch(e) {
    alert('网络错误，上传失败');
  } finally {
    if (btn) { btn.disabled = false; btn.textContent = '确认提交'; }
  }
}
