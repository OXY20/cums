on:
  push:
    tags:
      - 'v*'  # 推送 v2.4.0 这种 tag 时触发
  workflow_dispatch:

# 设置必要的权限
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            suffix: ''
            platform: linux
          - target: x86_64-unknown-pc-windows-msvc
            suffix: '.exe'
            platform: windows
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Rust 工具链
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 缓存 Rust 构建
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: backend

      - name: 缓存 npm 依赖
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: 构建前端
        working-directory: frontend
        run: |
          npm ci
          npm run build:only

      - name: 构建后端
        working-directory: backend
        run: cargo build --release --target ${{ matrix.target }}

      - name: 打包
        run: |
          VERSION=${GITHUB_REF#refs/tags/}
          DATE=$(date +%Y%m%d)

          mkdir -p release
          cp backend/target/${{ matrix.target }}/release/classroom-platform-server release/cums${{ matrix.suffix }}
          cp -r app/web release/
          cp app/config/config.toml release/config.toml
          cp README.md release/

          cd release
          zip -r ../cums_${VERSION}_${DATE}_${{ matrix.platform }}.zip *

      - name: 上传到 Release
        uses: softprops/action-gh-release@v1
        with:
          files: cums_*.zip
